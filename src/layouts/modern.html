<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{#if pageTitle}}{{pageTitle}}{{else}}SPXP – Social Profile Exchange Protocol{{/if}}</title>
    <meta name="description" content="{{#if pageDescription}}{{pageDescription}}{{else}}A decentralized social network protocol focusing on privacy, security, and individual sovereignty. Own your data. Control your feed. No algorithms.{{/if}}">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{#if pageCanonical}}{{pageCanonical}}{{else}}https://spxp.org/{{/if}}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{#if pageTitle}}{{pageTitle}}{{else}}SPXP – Social Profile Exchange Protocol{{/if}}">
    <meta property="og:description" content="{{#if pageDescription}}{{pageDescription}}{{else}}A decentralized social network protocol focusing on privacy, security, and individual sovereignty. Own your data. Control your feed. No algorithms.{{/if}}">
    <meta property="og:url" content="{{#if pageCanonical}}{{pageCanonical}}{{else}}https://spxp.org/{{/if}}">
    <meta property="og:image" content="{{#if pageOgImage}}{{pageOgImage}}{{else}}https://spxp.org/og-image.png{{/if}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="SPXP">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{#if pageTitle}}{{pageTitle}}{{else}}SPXP – Social Profile Exchange Protocol{{/if}}">
    <meta name="twitter:description" content="{{#if pageDescription}}{{pageDescription}}{{else}}A decentralized social network protocol focusing on privacy, security, and individual sovereignty. Own your data. Control your feed.{{/if}}">
    <meta name="twitter:image" content="{{#if pageOgImage}}{{pageOgImage}}{{else}}https://spxp.org/og-image.png{{/if}}">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SPXP – Social Profile Exchange Protocol",
        "url": "https://spxp.org/",
        "description": "A decentralized social network protocol focusing on privacy, security, and individual sovereignty.",
        "license": "https://opensource.org/licenses/Apache-2.0",
        "publisher": {
            "@type": "Organization",
            "name": "SPXP",
            "url": "https://spxp.org/",
            "logo": {
                "@type": "ImageObject",
                "url": "https://spxp.org/spxp-profile-logo.png"
            },
            "sameAs": [
                "https://github.com/spxp",
                "https://www.youtube.com/@SocialProfileExchangeProtocol"
            ]
        },
        "mainEntity": {
            "@type": "SoftwareApplication",
            "name": "SPXP",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web",
            "description": "Open protocol for decentralized social profiles with end-to-end encryption, signed content, and full data sovereignty.",
            "url": "https://spxp.org/",
            "license": "https://opensource.org/licenses/Apache-2.0",
            "softwareVersion": "0.3",
            "offers": {
                "@type": "Offer",
                "price": 0,
                "priceCurrency": "USD"
            }
        }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (pre-built) -->
    <link rel="stylesheet" href="/css/tailwind.css">
    
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        body { 
            background: #0a0a0f; 
            color: #e5e7eb;
        }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .terminal {
            background: #1a1a2e;
            border: 1px solid #2d2d44;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
        }
        .terminal-header {
            background: #2d2d44;
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            display: flex;
            gap: 6px;
        }
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .code-block {
            background: #1e1e2e;
            border-radius: 8px;
            overflow: hidden;
        }
        .code-block pre {
            margin: 0 !important;
            padding: 1rem !important;
            background: transparent !important;
        }
        .feature-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.05) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
        }
        .feature-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        .nav-blur {
            backdrop-filter: blur(12px);
            background: rgba(10, 10, 15, 0.8);
        }
        /* Mobile menu */
        #mobile-menu { display: none; }
        #mobile-menu.open { display: block; }
    </style>
</head>
<body class="antialiased">
    {{> body}}
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script>
        // Mobile menu toggle
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        if (btn && menu) {
            btn.addEventListener('click', () => menu.classList.toggle('open'));
        }
    </script>
</body>
</html>
